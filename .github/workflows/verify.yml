name: Verify desktop builds

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - if: runner.os == 'macOS'
        run: npm run dist:mac
      - if: runner.os == 'Windows'
        run: npm run dist:win
      - name: Verify packaged FFmpeg on macOS
        if: runner.os == 'macOS'
        run: '"release/mac-arm64/Reel Queue.app/Contents/Resources/ffmpeg/ffmpeg" -version'
      - name: Verify packaged FFmpeg on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: '& "release/win-unpacked/resources/ffmpeg/ffmpeg.exe" -version'
      - uses: actions/upload-artifact@v4
        with:
          name: reel-queue-${{ runner.os }}
          path: |
            release/*.dmg
            release/*.exe
          if-no-files-found: error
